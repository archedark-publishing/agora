{# Hero scene: Parthenon backdrop, olive branch, and the animated owl.
   Element ids and classes are driven by /static/home.js and /static/home.css. #}
<svg class="scene" viewBox="0 0 1440 860" preserveAspectRatio="xMinYMax slice" aria-hidden="true">
  <defs>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF4DB" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#FDE9C4" stop-opacity=".45"/>
      <stop offset="1" stop-color="#FDE9C4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1F6FE" stop-opacity="0"/>
      <stop offset="1" stop-color="#F6F9FE" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="marble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D5E0F0"/>
      <stop offset="1" stop-color="#BCCBE2"/>
    </linearGradient>
    <linearGradient id="bark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B4A3A"/>
      <stop offset="1" stop-color="#2E241B"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--o-mid)"/>
      <stop offset="1" stop-color="var(--o-blue)"/>
    </linearGradient>
    <linearGradient id="wingGradShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--o-blue)"/>
      <stop offset="1" stop-color="var(--o-navy)"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--o-sky)"/>
      <stop offset=".5" stop-color="var(--o-mid)"/>
      <stop offset="1" stop-color="var(--o-blue)"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--o-white)"/>
      <stop offset="1" stop-color="var(--o-frost)"/>
    </linearGradient>
    <clipPath id="bodyClip">
      <path d="M86,228 C82,190 86,158 98,132 C94,110 88,78 82,42 C108,60 132,88 150,112 C166,106 184,104 200,104 C216,104 234,106 250,112 C268,88 292,60 318,42 C312,78 306,110 302,132 C314,158 318,190 314,228 C326,288 322,352 290,395 C258,424 142,424 110,395 C78,352 74,288 86,228 Z"/>
    </clipPath>
    <clipPath id="eyeClipL"><circle cx="152" cy="192" r="42"/></clipPath>
    <clipPath id="eyeClipR"><circle cx="248" cy="192" r="42"/></clipPath>
    <!-- one talon; origin sits on the top of the branch, claw hooks toward +x -->
    <g id="owl-toe" stroke-linejoin="round">
      <path d="M-6,-14 L-6,0 C-6,7 -4,11 0,12 C4,11 6,7 6,0 L6,-14 Z" fill="var(--o-pale)"/>
      <path d="M-6,1 C-6,7 -4,11 0,12 C4,11 6,7 6,1 Z" fill="var(--o-frost)"/>
      <path d="M-6,-14 L-6,0 C-6,7 -4,11 0,12 C4,11 6,7 6,0 L6,-14" fill="none" stroke="var(--o-ink)" stroke-width="4"/>
      <path d="M-4,8 C-4,16 -1,22 5,24 C2.5,19 2,14 4,8 Z" fill="var(--o-ink)"/>
    </g>
    <!-- one wing, folded, pivoting on the round shoulder cap at (102,244) -->
    <g id="owl-wing">
      <path d="M87.9,249.1 A15,15 0 1 1 116.1,249.1 C130,296 136,352 128,398 Q124,412 113,404 Q106,414 97,401 Q86,408 79,388 C68,340 70,292 87.9,249.1 Z"
            stroke="var(--o-ink)" stroke-width="6" stroke-linejoin="round"/>
      <g stroke="var(--o-light)" stroke-width="5" stroke-linecap="round" fill="none">
        <path d="M94,298 L91,374 M106,272 V392 M119,296 L121,384"/>
      </g>
    </g>
  </defs>

  <g transform="translate(-420,-120) scale(1.2)">
  <!-- sun glow -->
  <circle cx="800" cy="420" r="360" fill="url(#sun)"/>

  <!-- distant hills -->
  <path d="M-300,650 L0,640 C180,600 320,610 470,580 C620,550 700,520 860,528 C1020,536 1120,590 1260,600 C1360,607 1410,596 1440,590 L1440,860 L-300,860 Z" fill="#D9E4F4"/>

  <!-- acropolis rock -->
  <path d="M470,640 C520,600 560,590 610,588 L1000,588 C1050,590 1090,604 1130,640 C1180,680 1240,700 1300,710 L380,710 C420,690 440,666 470,640 Z" fill="#C8D6EA"/>

  <!-- parthenon -->
  <g id="parthenon" opacity=".95">
    <!-- steps -->
    <rect x="590" y="572" width="420" height="16" fill="#B7C7DF"/>
    <rect x="600" y="558" width="400" height="14" fill="#C3D1E6"/>
    <rect x="610" y="546" width="380" height="12" fill="#CFDBEC"/>
    <!-- columns -->
    <g fill="url(#marble)">
      <rect x="622" y="420" width="22" height="126"/>
      <rect x="668" y="420" width="22" height="126"/>
      <rect x="714" y="420" width="22" height="126"/>
      <rect x="760" y="420" width="22" height="126"/>
      <rect x="818" y="420" width="22" height="126"/>
      <rect x="864" y="420" width="22" height="126"/>
      <rect x="910" y="420" width="22" height="126"/>
      <rect x="956" y="420" width="22" height="126"/>
    </g>
    <!-- fluting -->
    <g stroke="#AFC0DA" stroke-width="1.2">
      <path d="M630,424 V544 M637,424 V544 M676,424 V544 M683,424 V544 M722,424 V544 M729,424 V544 M768,424 V544 M775,424 V544 M826,424 V544 M833,424 V544 M872,424 V544 M879,424 V544 M918,424 V544 M925,424 V544 M964,424 V544 M971,424 V544"/>
    </g>
    <!-- column shadow interior -->
    <rect x="644" y="420" width="312" height="126" fill="#B3C3DC" opacity=".25"/>
    <!-- capitals -->
    <g fill="#C3D1E6">
      <rect x="617" y="412" width="32" height="8"/><rect x="663" y="412" width="32" height="8"/>
      <rect x="709" y="412" width="32" height="8"/><rect x="755" y="412" width="32" height="8"/>
      <rect x="813" y="412" width="32" height="8"/><rect x="859" y="412" width="32" height="8"/>
      <rect x="905" y="412" width="32" height="8"/><rect x="951" y="412" width="32" height="8"/>
    </g>
    <!-- architrave + frieze -->
    <rect x="606" y="392" width="388" height="20" fill="#CAD7EA"/>
    <rect x="606" y="372" width="388" height="20" fill="#BCCBE2"/>
    <g fill="#A9BBD6">
      <rect x="614" y="375" width="8" height="14"/><rect x="646" y="375" width="8" height="14"/><rect x="678" y="375" width="8" height="14"/>
      <rect x="710" y="375" width="8" height="14"/><rect x="742" y="375" width="8" height="14"/><rect x="774" y="375" width="8" height="14"/>
      <rect x="806" y="375" width="8" height="14"/><rect x="838" y="375" width="8" height="14"/><rect x="870" y="375" width="8" height="14"/>
      <rect x="902" y="375" width="8" height="14"/><rect x="934" y="375" width="8" height="14"/><rect x="966" y="375" width="8" height="14"/>
    </g>
    <rect x="598" y="364" width="404" height="8" fill="#D3DEEE"/>
    <!-- pediment -->
    <path d="M598,364 L800,300 L1002,364 Z" fill="#D3DEEE"/>
    <path d="M630,358 L800,312 L970,358 Z" fill="#C1CFE4"/>
  </g>

  </g>
  <!-- low haze over background -->
  <rect x="0" y="480" width="1440" height="260" fill="url(#haze)"/>

  <!-- foreground hill hint -->
  <path d="M0,790 C300,760 700,770 1000,760 C1200,754 1350,748 1440,745 L1440,860 L0,860 Z" fill="#EEF3FB"/>

  <!-- ===== branch (enters from left edge) ===== -->
  <g id="branch">
    <path d="M-60,618 C60,624 180,634 300,642 C420,650 540,662 680,684 C706,688 728,694 750,702 C724,700 700,700 676,698 C540,690 420,680 300,674 C180,668 60,664 -60,660 Z" fill="url(#bark)"/>
    <!-- twig -->
    <path d="M560,670 C590,648 610,636 640,628 C616,646 596,660 574,678 Z" fill="#3B2F24"/>
    <!-- olive leaves -->
    <g class="leaf-sway">
      <path d="M640,628 C660,610 686,606 706,612 C688,626 662,632 640,628 Z" fill="#7C9A74"/>
      <path d="M624,636 C628,614 642,598 662,590 C656,610 642,628 624,636 Z" fill="#6B8A64"/>
    </g>
    <g class="leaf-sway" style="animation-delay:-1.8s">
      <path d="M700,694 C720,706 736,724 742,744 C722,736 706,718 700,694 Z" fill="#7C9A74"/>
      <path d="M672,694 C682,716 684,740 678,758 C666,740 664,716 672,694 Z" fill="#6B8A64"/>
    </g>
    <g class="leaf-sway" style="animation-delay:-3s">
      <path d="M90,630 C96,606 112,592 134,588 C126,610 110,626 90,630 Z" fill="#6B8A64"/>
      <path d="M60,662 C66,686 62,708 50,724 C42,704 46,682 60,662 Z" fill="#7C9A74"/>
      <path d="M150,640 C170,626 194,624 212,632 C194,644 170,648 150,640 Z" fill="#8AA882"/>
    </g>
  </g>

  <!-- ===== OWL ===== owl-local coords: 400 x 440, feet at y≈410.
       Strokes: 6 for major shapes (body, face, eyes, wings), 4 for detail. -->
  <g transform="translate(150,128) scale(1.25)">
    <g id="owl-fly">
    <g id="owl" class="flapping">
      <!-- soft contact shadow on branch -->
      <ellipse cx="200" cy="421" rx="80" ry="6" fill="var(--o-ink)" opacity=".14"/>

      <!-- talons curling over the branch, tucked under the belly -->
      <g id="feet">
        <use href="#owl-toe" transform="translate(164,417) rotate(14)"/>
        <use href="#owl-toe" transform="translate(176,418)"/>
        <use href="#owl-toe" transform="translate(188,418) rotate(-10)"/>
        <use href="#owl-toe" transform="translate(236,422) rotate(-14) scale(-1,1)"/>
        <use href="#owl-toe" transform="translate(224,422) scale(-1,1)"/>
        <use href="#owl-toe" transform="translate(212,421) rotate(10) scale(-1,1)"/>
      </g>

      <g id="owl-body">
        <!-- body silhouette (same path as #bodyClip) -->
        <path d="M86,228 C82,190 86,158 98,132 C94,110 88,78 82,42 C108,60 132,88 150,112 C166,106 184,104 200,104 C216,104 234,106 250,112 C268,88 292,60 318,42 C312,78 306,110 302,132 C314,158 318,190 314,228 C326,288 322,352 290,395 C258,424 142,424 110,395 C78,352 74,288 86,228 Z"
              fill="url(#bodyGrad)" stroke="var(--o-ink)" stroke-width="6" stroke-linejoin="round"/>

        <!-- ear tuft feathers; outside #head because the tufts don't turn -->
        <path d="M89,62 C104,76 122,94 136,110 L106,124 C104,102 98,82 89,62 Z" fill="var(--o-navy)"/>
        <path d="M311,62 C296,76 278,94 264,110 L294,124 C296,102 302,82 311,62 Z" fill="var(--o-deep)"/>
        <path d="M97,84 C101,96 103,106 105,116 M303,84 C299,96 297,106 295,116" stroke="var(--o-light)" stroke-width="4" stroke-linecap="round" fill="none"/>

        <!-- chest: colonnade under an architrave, then layered chevrons -->
        <g clip-path="url(#bodyClip)" stroke="var(--o-ink)" stroke-width="4" stroke-linejoin="round">
          <g stroke="none">
            <rect x="121" y="276" width="24" height="74" fill="var(--o-pale)"/>
            <rect x="155" y="276" width="24" height="94" fill="var(--o-pale)"/>
            <rect x="189" y="276" width="22" height="114" fill="var(--o-pale)"/>
            <rect x="200" y="276" width="11" height="114" fill="var(--o-frost)"/>
            <rect x="221" y="276" width="24" height="94" fill="var(--o-frost)"/>
            <rect x="255" y="276" width="24" height="74" fill="var(--o-frost)"/>
          </g>
          <path d="M100,264 H300 V278 H100 Z" fill="var(--o-pale)"/>
          <path d="M70,298 L200,372 L330,298 L330,338 L200,412 L70,338 Z" fill="var(--o-navy)"/>
          <path d="M200,372 L330,298 L330,338 L200,412 Z" fill="var(--o-deep)" stroke="none"/>
          <path d="M70,298 L200,372 L330,298" fill="none"/>
          <path d="M70,318 L200,392 L330,318" fill="none" stroke="var(--o-blue)"/>
        </g>

        <!-- head -->
        <g id="head">
          <!-- forehead chevrons -->
          <path d="M182,124 L200,142 L218,124" fill="none" stroke="var(--o-navy)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M189,138 L200,149 L211,138" fill="none" stroke="var(--o-light)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

          <!-- brows sweeping up toward the tufts -->
          <path d="M200,178 C178,150 148,134 114,126 C123,143 136,154 153,160 C173,166 188,174 200,190 Z"
                fill="var(--o-white)" stroke="var(--o-ink)" stroke-width="6" stroke-linejoin="round"/>
          <path d="M200,178 C222,150 252,134 286,126 C277,143 264,154 247,160 C227,166 212,174 200,190 Z"
                fill="var(--o-pale)" stroke="var(--o-ink)" stroke-width="6" stroke-linejoin="round"/>

          <!-- facial disc -->
          <path d="M200,188 C180,160 126,152 106,190 C98,230 128,256 166,252 L200,274 L234,252 C272,256 302,230 294,190 C274,152 220,160 200,188 Z"
                fill="var(--o-light)" stroke="var(--o-ink)" stroke-width="6" stroke-linejoin="round"/>
          <path d="M200,191 L200,270 L233,249 C270,253 299,229 291,191 C272,156 222,163 200,191 Z" fill="var(--o-mid)" opacity=".22"/>

          <!-- eyes -->
          <g class="eye" data-cx="152" data-cy="192">
            <circle cx="152" cy="192" r="42" fill="url(#ringGrad)" stroke="var(--o-ink)" stroke-width="6"/>
            <g clip-path="url(#eyeClipL)">
              <g class="pupil">
                <circle cx="152" cy="192" r="27" fill="var(--o-ink)"/>
                <circle cx="143" cy="182" r="7.5" fill="var(--o-white)"/>
                <circle cx="161" cy="202" r="2.5" fill="var(--o-white)" opacity=".7"/>
              </g>
              <ellipse class="lid" cx="152" cy="192" rx="50" ry="48" fill="var(--o-mid)" stroke="var(--o-ink)" stroke-width="4"/>
            </g>
          </g>
          <g class="eye" data-cx="248" data-cy="192">
            <circle cx="248" cy="192" r="42" fill="url(#ringGrad)" stroke="var(--o-ink)" stroke-width="6"/>
            <g clip-path="url(#eyeClipR)">
              <g class="pupil">
                <circle cx="248" cy="192" r="27" fill="var(--o-ink)"/>
                <circle cx="239" cy="182" r="7.5" fill="var(--o-white)"/>
                <circle cx="257" cy="202" r="2.5" fill="var(--o-white)" opacity=".7"/>
              </g>
              <ellipse class="lid" cx="248" cy="192" rx="50" ry="48" fill="var(--o-mid)" stroke="var(--o-ink)" stroke-width="4"/>
            </g>
          </g>

          <!-- beak -->
          <path d="M200,212 L216,236 L200,270 L184,236 Z" fill="var(--o-blue)" stroke="var(--o-ink)" stroke-width="4" stroke-linejoin="round"/>
          <path d="M200,214 L214,236 L200,266 Z" fill="var(--o-navy)"/>
        </g>
      </g>

      <!-- wings (drawn over body sides; pivot at the shoulder caps) -->
      <g id="wing-l" class="wing">
        <use href="#owl-wing" fill="url(#wingGrad)"/>
      </g>
      <g id="wing-r" class="wing">
        <use href="#owl-wing" fill="url(#wingGradShade)" transform="matrix(-1 0 0 1 400 0)"/>
      </g>

      </g>
    </g>
    </g>
  </g>
</svg>
